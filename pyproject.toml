[project]
name = "thermal-planner"
version = "0.3.1"
requires-python = ">=3.14.2"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/ajmckee/warmy-warm"
Issues = "https://github.com/ajmckee/warmy-warm/issues"

[project.optional-dependencies]
test = ["homeassistant==2026.7.0", "pytest>=8", "pytest-asyncio>=1", "voluptuous-serialize", "ruff"]
test-ui = ["playwright==1.65.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
